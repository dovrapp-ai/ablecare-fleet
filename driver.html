  <style>

    .clock-card{text-align:center}.clock-time{font-size:36px;font-weight:900;letter-spacing:-1px}.clock-date{font-size:13px;color:var(--muted);margin:4px 0 16px}.primary{width:100%;border:0;border-radius:14px;padding:16px;color:#fff;background:var(--cyan);font-weight:900;font-size:15px;box-shadow:0 8px 18px rgba(22,184,212,.25)}.primary.out{background:#fff;color:var(--red);border:2px solid #f2caca;box-shadow:none}.primary:disabled{opacity:.55;box-shadow:none}.shift-note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.45}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#eaf1f6;border-radius:13px;padding:4px;margin-bottom:14px}.tab{border:0;border-radius:10px;background:transparent;color:var(--muted);padding:10px;font-weight:850;font-size:13px}.tab.active{background:#fff;color:var(--navy);box-shadow:0 2px 9px rgba(11,31,51,.1)}
    .ride{border:1px solid var(--line);border-left:4px solid var(--cyan);border-radius:14px;padding:14px;margin-top:10px;transition:background .2s,border-color .2s,opacity .2s}.ride.next-ride{background:#eafafd;border-color:#78d9e8;box-shadow:0 0 0 2px rgba(22,184,212,.12)}.ride.completed-ride{background:#f3f7f5;border-left-color:var(--green);opacity:.72}.next-banner{display:inline-flex;margin-bottom:8px;border-radius:999px;background:var(--cyan);color:#fff;padding:5px 9px;font-size:10px;font-weight:950;letter-spacing:.8px}.ride-top{display:flex;align-items:center;gap:8px}.time{font-size:14px;font-weight:950}.type{font-size:10px;font-weight:900;background:#e7f8fb;color:#087d96;border-radius:999px;padding:4px 7px}.client{font-weight:900;font-size:16px;margin:9px 0 3px}.facility{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:9px}.ride-meta{font-size:12px;color:#334e68;font-weight:800;margin:7px 0}.call-link{display:inline-flex;align-items:center;margin-left:6px;border-radius:999px;background:#e7f8fb;color:#087d96;padding:5px 9px;text-decoration:none;font-size:11px;font-weight:900}.route{font-size:12px;line-height:1.5;color:#465e73}.route-stop{margin-top:10px;padding:10px;border-radius:12px;background:#f8fbfd}.route-stop:first-child{margin-top:0}.route-stop.done{background:#eaf7f0;color:#47705e}.route-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.complete-btn{border:0;border-radius:10px;background:var(--navy);color:#fff;padding:9px 11px;font-size:11px;font-weight:900}.complete-btn:disabled{background:#d9e3ea;color:#718294}.complete-btn.done{background:var(--green);color:#fff}.complete-time{font-size:10px;color:var(--green);font-weight:850;margin-top:6px}.notes{font-size:12px;background:#fff8e8;color:#7c570f;border-radius:9px;padding:8px;margin-top:9px}.nav-link{display:inline-flex;margin-top:9px;color:#087d96;font-size:12px;font-weight:850;text-decoration:none}
    .empty{text-align:center;padding:24px 10px;color:var(--muted);font-size:13px;line-height:1.5}.released{font-size:11px;color:var(--green);font-weight:850}.unreleased{color:var(--amber)}
    .login{padding:0;background:var(--paper)}.login-head{position:relative;background:var(--navy);color:#fff;padding:calc(28px + env(safe-area-inset-top)) 22px 36px;border-radius:0 0 26px 26px}.lang-btn{position:absolute;right:18px;top:calc(18px + env(safe-area-inset-top));border:1px solid rgba(255,255,255,.35);border-radius:999px;background:rgba(255,255,255,.1);color:#fff;padding:7px 10px;font-size:11px;font-weight:900}.login-head .brand{color:#fff}.login-head h2{font-size:28px;line-height:1.2;margin:30px 0 7px}.login-head h2 span{color:var(--cyan)}.login-head p{font-size:13px;color:#9db2c5;margin:0}.login-body{padding:22px}.login-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:800;margin:0 0 14px}.driver-grid{display:grid;grid-template-columns:1fr;gap:10px}.driver-btn{display:flex;align-items:center;gap:14px;border:0;background:#fff;border-radius:18px;padding:15px;text-align:left;box-shadow:0 3px 12px rgba(11,31,51,.07);font-weight:850;color:var(--ink)}.driver-avatar{width:46px;height:46px;border-radius:13px;color:#fff;display:grid;place-items:center;font-size:20px;font-weight:950}.driver-info{flex:1}.driver-role{display:block;font-size:11px;color:var(--muted);margin-top:3px;font-weight:600}.driver-arrow{width:34px;height:34px;border-radius:9px;background:#e7f8fb;color:#087d96;display:grid;place-items:center;font-size:22px}.pin-screen{text-align:center}.pin-dots{display:flex;justify-content:center;gap:16px;margin:28px 0 18px}.pin-dot{width:16px;height:16px;border-radius:50%;background:var(--navy2);border:2px solid var(--muted)}.pin-dot.on{background:var(--cyan);border-color:var(--cyan)}.keypad{width:260px;max-width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 auto 16px}.key{height:60px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:var(--navy2);color:#fff;font-size:22px;font-weight:800}.key.ok{background:var(--cyan);color:var(--navy)}.back-btn{border:0;background:none;color:var(--muted);padding:12px;font-size:14px}.error{min-height:20px;text-align:center;color:var(--red);font-size:12px;margin-top:6px}.utility{display:flex;justify-content:center;gap:15px;margin-top:18px}.text-btn{border:0;background:none;color:var(--muted);font-size:12px;font-weight:800;padding:5px}.hidden{display:none!important}.loading{display:grid;place-items:center;min-height:100vh;color:var(--muted);font-weight:800}.offline{position:fixed;z-index:5;top:0;left:50%;transform:translateX(-50%);background:#fff1c7;color:#795600;padding:7px 14px;border-radius:0 0 10px 10px;font-size:11px;font-weight:900}
    @media(max-width:380px){.hero{padding-left:17px;padding-right:17px}.driver-name{font-size:23px}main{padding-left:13px;padding-right:13px}.clock-time{font-size:32px}}
  </style>
</head>
<body>
  <div id="offline" class="offline hidden">Offline — reconnect to update your shift</div>
  <div id="loading" class="loading">Loading AbleCare Driver…</div>
  <div id="login" class="shell login hidden">
    <div class="login-head"><button id="login-lang" class="lang-btn">Español</button><div class="brand"><div class="mark">A</div><div><h1>AbleCare Mobility</h1><p>DRIVER APP</p></div></div><h2 id="login-title">Good morning,<br><span>Driver!</span></h2><p id="login-subtitle">Tap your name to see your schedule</p></div>
    <div class="login-body">
      <div id="select-screen"><div class="login-label">Select Your Name</div><div id="driver-grid" class="driver-grid"></div></div>
      <div id="pin-screen" class="pin-screen hidden"><div class="pin-dots"><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span></div><div id="login-error" class="error"></div><div id="keypad" class="keypad"></div><button id="pin-back" class="back-btn">← Back</button></div>
      <input id="pin" class="hidden" inputmode="numeric" maxlength="4" aria-label="Four digit driver PIN">
    </div>
  </div>
  <div id="app" class="shell hidden">
    <header class="hero"><button id="app-lang" class="lang-btn">Español</button><div class="brand"><div class="mark">A</div><div><h1>AbleCare Mobility</h1><p id="portal-label">Driver Portal</p></div></div><div class="hero-row"><div><div id="welcome-label" class="hello">Welcome back</div><div id="driver-name" class="driver-name"></div></div><div id="shift-pill" class="shift-pill">OFF SHIFT</div></div></header>
    <main>
      <section class="card"><div class="section-title"><h2 id="schedule-label">Your schedule</h2></div><div class="section-title"><h2 id="today-label" style="font-size:12px;letter-spacing:1px">TODAY</h2><span id="today-count" class="count"></span></div><div id="today-rides"></div><div class="section-title" style="margin-top:20px"><h2 id="tomorrow-label" style="font-size:12px;letter-spacing:1px">TOMORROW</h2><span id="release-state" class="released"></span></div><div id="tomorrow-rides"></div></section>
      <section class="card clock-card"><div id="clock-time" class="clock-time"></div><div id="clock-date" class="clock-date"></div><button id="clock-btn" class="primary">CLOCK IN — START SHIFT</button></section>
      <div class="utility"><button id="refresh-btn" class="text-btn">Refresh schedule</button><button id="logout-btn" class="text-btn">← Not you? Go back</button></div>
    </main>
  </div>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script>
    const cfg={apiKey:'AIzaSyBhVuubrvIg5iq_CWByHCn-LF6txhZG0Ig',authDomain:'ablecare-fleet.firebaseapp.com',databaseURL:'https://ablecare-fleet-default-rtdb.firebaseio.com',projectId:'ablecare-fleet',storageBucket:'ablecare-fleet.firebasestorage.app',messagingSenderId:'429072390729',appId:'1:429072390729:web:fb3bbb1561c376cf9ebd98'};
    firebase.initializeApp(cfg); const db=firebase.database();
    const $=id=>document.getElementById(id), safe=s=>String(s||'').replace(/[.#$\[\]\/]/g,'_');
    let drivers=[], selected=null, active=null, shift=null, allRides={}, schedules={}, view='today',language=localStorage.getItem('ablecareDriverLanguage')||'en';
    const words={en:{switchLanguage:'Español',goodMorning:'Good morning',driver:'Driver!',tapName:'Tap your name to see your schedule',selectName:'Select Your Name',vanDriver:'Van Driver · AbleCare Mobility',welcome:'Welcome',enterPin:'Enter your PIN to see your schedule',back:'← Back',portal:'Driver Portal',welcomeBack:'Welcome back',schedule:'Your schedule',today:'TODAY',tomorrow:'TOMORROW',ride:'ride',rides:'rides',notReleased:'Not released yet',noToday:'No rides assigned for today',noTomorrow:'No rides scheduled for tomorrow yet',notSent:'Tomorrow’s schedule has not been sent yet.',onDuty:'ON DUTY',offShift:'OFF SHIFT',clockIn:'CLOCK IN — START SHIFT',clockOut:'CLOCK OUT — END SHIFT',facility:'Facility',helper:'Helper',helperRole:'HELPER',driverRole:'DRIVER',assignedDriver:'Driver',clientPhone:'Client phone',phoneNotProvided:'Phone not provided',schedulingContact:'Scheduling contact',call:'Call',pickup:'Pickup',dropoff:'Drop-off',notProvided:'Not provided',openPickup:'Open Pickup in Maps',openDropoff:'Open Drop-off in Maps',completePickup:'Complete Pickup',completeDropoff:'Complete Drop-off',pickupCompleted:'Pickup completed',dropoffCompleted:'Drop-off completed',nextTrip:'NEXT TRIP',updateError:'Could not update the ride. Please try again.',refresh:'Refresh schedule',notYou:'← Not you? Go back',timeTbd:'Time TBD',wheelchair:'Wheelchair',stretcher:'Stretcher',ambulatory:'Ambulatory',wrongPin:'That PIN is not correct.',chooseName:'Choose your name first.',needInternet:'You need an internet connection to clock in or out.',shiftError:'Could not update your shift. Please try again.'},es:{switchLanguage:'English',goodMorning:'Buenos días',driver:'¡Conductor!',tapName:'Toque su nombre para ver su horario',selectName:'Seleccione su nombre',vanDriver:'Conductor · AbleCare Mobility',welcome:'Bienvenido',enterPin:'Ingrese su PIN para ver su horario',back:'← Atrás',portal:'Portal del conductor',welcomeBack:'Bienvenido de nuevo',schedule:'Su horario',today:'HOY',tomorrow:'MAÑANA',ride:'viaje',rides:'viajes',notReleased:'Aún no enviado',noToday:'No hay viajes asignados para hoy',noTomorrow:'No hay viajes programados para mañana',notSent:'El horario de mañana aún no ha sido enviado.',onDuty:'EN TURNO',offShift:'FUERA DE TURNO',clockIn:'MARCAR ENTRADA — INICIAR TURNO',clockOut:'MARCAR SALIDA — TERMINAR TURNO',facility:'Centro',helper:'Ayudante',helperRole:'AYUDANTE',driverRole:'CONDUCTOR',assignedDriver:'Conductor',clientPhone:'Teléfono del cliente',phoneNotProvided:'Teléfono no proporcionado',schedulingContact:'Contacto de programación',call:'Llamar',pickup:'Recogida',dropoff:'Destino',notProvided:'No proporcionado',openPickup:'Abrir recogida en Maps',openDropoff:'Abrir destino en Maps',completePickup:'Completar recogida',completeDropoff:'Completar destino',pickupCompleted:'Recogida completada',dropoffCompleted:'Destino completado',nextTrip:'PRÓXIMO VIAJE',updateError:'No se pudo actualizar el viaje. Inténtelo de nuevo.',refresh:'Actualizar horario',notYou:'← ¿No es usted? Regresar',timeTbd:'Hora pendiente',wheelchair:'Silla de ruedas',stretcher:'Camilla',ambulatory:'Ambulatorio',wrongPin:'El PIN no es correcto.',chooseName:'Seleccione su nombre primero.',needInternet:'Necesita conexión a internet para marcar entrada o salida.',shiftError:'No se pudo actualizar su turno. Inténtelo de nuevo.'}};
    const tr=key=>words[language][key]||words.en[key]||key;
    const dateKey=(offset=0)=>{const d=new Date();d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
    const parseTime=t=>{if(!t)return 9999;const m=String(t).match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);if(!m)return 9999;let h=+m[1];if(m[3]){if(m[3].toUpperCase()==='PM'&&h<12)h+=12;if(m[3].toUpperCase()==='AM'&&h===12)h=0}return h*60+(+m[2])};
    const fmtTime=t=>{if(!t)return tr('timeTbd');const mins=parseTime(t);if(mins===9999)return t;const h=Math.floor(mins/60),m=mins%60;return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`};
    const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function show(which){$('loading').classList.add('hidden');$('login').classList.toggle('hidden',which!=='login');$('app').classList.toggle('hidden',which!=='app')}
    async function boot(){
      try{const snap=await db.ref('drivers').once('value');drivers=Object.values(snap.val()||{}).filter(d=>d&&d.active&&d.name);renderDrivers();const saved=localStorage.getItem('ablecareDriver');if(saved){const d=drivers.find(x=>x.name===saved);if(d){active=d;await enterApp();return}}show('login')}catch(e){$('loading').textContent='Unable to connect. Check your internet and refresh.'}}
    const driverColors=['#16b8d4','#7c5ce7','#f0a21b','#16835b','#e45c78'];
    function renderDrivers(){const grid=$('driver-grid');grid.innerHTML='';drivers.forEach((d,i)=>{const b=document.createElement('button');b.className='driver-btn';b.innerHTML=`<span class="driver-avatar" style="background:${driverColors[i%driverColors.length]}">${esc(d.name[0])}</span><span class="driver-info">${esc(d.name)}<span class="driver-role">${tr('vanDriver')}</span></span><span class="driver-arrow">›</span>`;b.onclick=()=>selectDriver(d);grid.appendChild(b)})}
    function selectDriver(d){selected=d;$('pin').value='';$('login-error').textContent='';updatePinDots();$('select-screen').classList.add('hidden');$('pin-screen').classList.remove('hidden');$('login-title').innerHTML=`${tr('welcome')},<br><span>${esc(d.name)}!</span>`;$('login-subtitle').textContent=tr('enterPin')}
    function backToDrivers(){selected=null;$('pin').value='';$('login-error').textContent='';$('pin-screen').classList.add('hidden');$('select-screen').classList.remove('hidden');applyLanguage()}
    function updatePinDots(){document.querySelectorAll('.pin-dot').forEach((dot,i)=>dot.classList.toggle('on',i<$('pin').value.length))}
    function pinKey(key){let value=$('pin').value;if(key==='del')value=value.slice(0,-1);else if(key==='ok'){login();return}else if(value.length<4)value+=key;$('pin').value=value;updatePinDots();$('login-error').textContent='';if(value.length===4)login()}
    async function login(){const pin=$('pin').value;if(!selected){$('login-error').textContent=tr('chooseName');return}if(String(selected.pin)!==pin){$('login-error').textContent=tr('wrongPin');$('pin').value='';updatePinDots();return}active=selected;localStorage.setItem('ablecareDriver',active.name);await enterApp()}
    async function enterApp(){$('driver-name').textContent=active.name;show('app');await Promise.all([loadShift(),loadData()]);renderShift();renderRides()}
    async function loadShift(){const savedKey=localStorage.getItem('ablecareShiftKey');if(savedKey){const snap=await db.ref(`shifts/${safe(active.name)}/${savedKey}`).once('value');const val=snap.val();if(val&&!val.clockOut){shift={key:savedKey,...val};return}}const snap=await db.ref(`shifts/${safe(active.name)}`).once('value');const entries=Object.entries(snap.val()||{}).filter(([,v])=>v&&!v.clockOut).sort((a,b)=>(b[1].clockIn||0)-(a[1].clockIn||0));shift=entries.length?{key:entries[0][0],...entries[0][1]}:null;if(shift)localStorage.setItem('ablecareShiftKey',shift.key);else localStorage.removeItem('ablecareShiftKey')}
    async function loadData(){const [r,s]=await Promise.all([db.ref('rides').once('value'),db.ref('schedules').once('value')]);allRides=r.val()||{};schedules=s.val()||{}}
    async function toggleClock(){if(!navigator.onLine){alert(tr('needInternet'));return}$('clock-btn').disabled=true;try{const now=Date.now(),driverKey=safe(active.name);if(!shift){const newRef=db.ref(`shifts/${driverKey}`).push();shift={key:newRef.key,clockIn:now,clockOut:null,driver:active.name,source:'driver-web'};await Promise.all([newRef.set(shift),db.ref(`locations/${driverKey}`).update({driver:active.name,status:'in',clockIn:now,clockOut:null,lat:null,lng:null,ts:now,tracking:false,source:'driver-web'})]);localStorage.setItem('ablecareShiftKey',shift.key)}else{const durationMs=Math.max(0,now-shift.clockIn);await Promise.all([db.ref(`shifts/${driverKey}/${shift.key}`).update({clockOut:now,durationMs,source:'driver-web'}),db.ref(`locations/${driverKey}`).update({status:'out',clockOut:now,ts:now,tracking:false,source:'driver-web'})]);shift=null;localStorage.removeItem('ablecareShiftKey')}renderShift()}catch(e){alert(tr('shiftError'))}finally{$('clock-btn').disabled=false}}
    function renderShift(){const on=!!shift;$('shift-pill').textContent=on?tr('onDuty'):tr('offShift');$('shift-pill').classList.toggle('in',on);$('clock-btn').textContent=on?tr('clockOut'):tr('clockIn');$('clock-btn').classList.toggle('out',on)}
    function driverSafeNotes(value){const note=String(value||'').trim();if(!note)return '';if(/(?:^|\s)\$?\d[\d,.]*\s*(?:total|tip)\b|\b(?:total|tip)\s*[:$]/i.test(note))return '';return note}
    function rideAddress(r,kind){const fields=kind==='pickup'?['pickup','pickupAddress','pickup_location','pickupLocation','pickupAddr','from','origin','facilityPickup','facility']:['dropoff','dropoffAddress','dropoff_location','dropoffLocation','dropoffAddr','to','destination','appointmentAddress'];return fields.map(k=>r[k]).find(Boolean)||''}
    function mapLink(address,label){return address?`<a class="nav-link" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}">${label} →</a>`:''}
    function ridePhone(r){return String(r.facilityPhone||r.facility_phone||r.requesterPhone||r.requester_phone||r.schedulerPhone||r.contactPhone||'').trim()}
    function rideClientPhone(r){return String(r.clientPhone||r.client_phone||r.phone||'').trim()}
    function phoneLink(phone){const digits=phone.replace(/\D/g,'');return digits?`<a class="call-link" href="tel:${digits}">☎ ${tr('call')} ${esc(phone)}</a>`:''}
    function rideType(r){return r.ridetype==='str'?tr('stretcher'):r.ridetype==='wc'?tr('wheelchair'):tr('ambulatory')}
    function assignmentNames(value){return String(value||'').split('/').map(v=>v.trim().toLowerCase()).filter(Boolean)}
    function rideRole(r){const name=String(active?.name||'').trim().toLowerCase();if(!name)return'';const driver=assignmentNames(r.driver).includes(name),helper=assignmentNames(r.helper).includes(name);return helper&&!driver?'helper':driver?'driver':''}
    function rideDone(r){return rideRole(r)==='helper'?(!!r.helperDropoffCompletedAt||['complete','completed'].includes(String(r.helperStatus||''))):(!!r.dropoffCompletedAt||['complete','completed'].includes(String(r.status||'')))}
    function pickupDone(r){return rideRole(r)==='helper'?(rideDone(r)||!!r.helperPickupCompletedAt||String(r.helperStatus||'')==='onboard'):(rideDone(r)||!!r.pickupCompletedAt||String(r.status||'')==='onboard')}
    function completionStamp(ts){return ts?new Date(Number(ts)).toLocaleTimeString(language==='es'?'es-US':'en-US',{hour:'numeric',minute:'2-digit'}):''}
    function renderRideList(list,box,emptyText,nextKey){if(!list.length){box.innerHTML=`<div class="empty">${emptyText}</div>`;return}box.innerHTML=list.map(r=>{const p=rideAddress(r,'pickup'),d=rideAddress(r,'dropoff'),note=driverSafeNotes(r.notes),facility=String(r.facility||'').trim(),helper=String(r.helper||'').trim(),role=rideRole(r),mainDriver=String(r.driver||'').trim(),clientPhone=rideClientPhone(r),phone=ridePhone(r),pDone=pickupDone(r),dDone=rideDone(r),pickupAt=role==='helper'?r.helperPickupCompletedAt:r.pickupCompletedAt,dropoffAt=role==='helper'?r.helperDropoffCompletedAt:r.dropoffCompletedAt,isNext=r.key===nextKey;return `<article class="ride${isNext?' next-ride':''}${dDone?' completed-ride':''}">${isNext?`<div class="next-banner">${tr('nextTrip')}</div>`:''}<div class="ride-top"><span class="type">${esc(rideType(r))}</span><span class="type" style="background:${role==='helper'?'#fff1df':'#e7f8fb'};color:${role==='helper'?'#b45309':'#087d96'}">${tr(role==='helper'?'helperRole':'driverRole')}</span><span class="time" style="margin-left:auto">${esc(fmtTime(r.time))}</span></div><div class="client">${esc(r.client||'Client TBD')}</div>${facility?`<div class="facility">${tr('facility')}: ${esc(facility)}</div>`:''}${role==='helper'?`<div class="ride-meta">${tr('assignedDriver')}: ${esc(mainDriver||tr('notProvided'))}</div>`:helper?`<div class="ride-meta">${tr('helper')}: ${esc(helper)}</div>`:''}<div class="ride-meta">${tr('clientPhone')}: ${clientPhone?phoneLink(clientPhone):`<span style="color:var(--muted);font-weight:700">${tr('phoneNotProvided')}</span>`}</div>${phone?`<div class="ride-meta">${tr('schedulingContact')}: ${phoneLink(phone)}</div>`:''}<div class="route"><div class="route-stop${pDone?' done':''}"><div>${tr('pickup')}: ${esc(p||tr('notProvided'))}</div><div class="route-actions">${mapLink(p,tr('openPickup'))}<button class="complete-btn${pDone?' done':''}" onclick="completeRideStop('${esc(r.key)}','pickup')"${pDone?' disabled':''}>${pDone?'✓ '+tr('pickupCompleted'):tr('completePickup')}</button></div>${pickupAt?`<div class="complete-time">${tr('pickupCompleted')} ${completionStamp(pickupAt)}</div>`:''}</div><div class="route-stop${dDone?' done':''}"><div>${tr('dropoff')}: ${esc(d||tr('notProvided'))}</div><div class="route-actions">${mapLink(d,tr('openDropoff'))}<button class="complete-btn${dDone?' done':''}" onclick="completeRideStop('${esc(r.key)}','dropoff')"${dDone||!pDone?' disabled':''}>${dDone?'✓ '+tr('dropoffCompleted'):tr('completeDropoff')}</button></div>${dropoffAt?`<div class="complete-time">${tr('dropoffCompleted')} ${completionStamp(dropoffAt)}</div>`:''}</div></div>${note?`<div class="notes">${esc(note)}</div>`:''}</article>`}).join('')}
    async function completeRideStop(rideKey,stop){if(!navigator.onLine){alert(tr('needInternet'));return}const ride=allRides[rideKey];if(!ride)return;const now=Date.now(),isHelper=rideRole(ride)==='helper',updates={updatedAt:now};if(isHelper){updates.helperStatusUpdatedAt=now;updates.helperStatusUpdatedBy=active.name;updates.helperStatusSource='driver-web';if(stop==='pickup'){updates.helperPickupCompletedAt=now;updates.helperPickupCompletedBy=active.name;updates.helperStatus='onboard'}else{if(!pickupDone(ride))return;updates.helperDropoffCompletedAt=now;updates.helperDropoffCompletedBy=active.name;updates.helperCompletedAt=now;updates.helperCompletedBy=active.name;updates.helperStatus='complete'}}else{updates.statusUpdatedAt=now;updates.statusUpdatedBy=active.name;updates.statusSource='driver-web';if(stop==='pickup'){updates.pickupCompletedAt=now;updates.pickupCompletedBy=active.name;updates.status='onboard'}else{if(!pickupDone(ride))return;updates.dropoffCompletedAt=now;updates.dropoffCompletedBy=active.name;updates.status='complete';updates.completedAt=now;updates.completedBy=active.name}}try{await db.ref(`rides/${rideKey}`).update(updates);allRides[rideKey]={...ride,...updates};renderRides()}catch(e){alert(tr('updateError'))}}
    function renderRides(){const rides=Object.entries(allRides).map(([key,r])=>({key,...r})).filter(r=>rideRole(r));const today=rides.filter(r=>r.date===dateKey(0)).sort((a,b)=>parseTime(a.time)-parseTime(b.time));const tomorrow=rides.filter(r=>r.date===dateKey(1)).sort((a,b)=>parseTime(a.time)-parseTime(b.time));const released=!!schedules[dateKey(1)]?.sentAt;const eligible=[...today,...(released?tomorrow:[])];const nextRide=eligible.find(r=>!rideDone(r));const nextKey=nextRide?.key||'';$('today-count').textContent=`${today.length} ${today.length===1?tr('ride'):tr('rides')}`;$('release-state').textContent=released?`${tomorrow.length} ${tomorrow.length===1?tr('ride'):tr('rides')}`:tr('notReleased');$('release-state').classList.toggle('unreleased',!released);renderRideList(today,$('today-rides'),tr('noToday'),nextKey);if(released)renderRideList(tomorrow,$('tomorrow-rides'),tr('noTomorrow'),nextKey);else $('tomorrow-rides').innerHTML=`<div class="empty">${tr('notSent')}</div>`}
    function applyLanguage(){document.documentElement.lang=language;$('login-lang').textContent=tr('switchLanguage');$('app-lang').textContent=tr('switchLanguage');$('portal-label').textContent=tr('portal');$('welcome-label').textContent=tr('welcomeBack');$('schedule-label').textContent=tr('schedule');$('today-label').textContent=tr('today');$('tomorrow-label').textContent=tr('tomorrow');$('refresh-btn').textContent=tr('refresh');$('logout-btn').textContent=tr('notYou');$('pin-back').textContent=tr('back');document.querySelector('.login-label').textContent=tr('selectName');if(selected&&!$('pin-screen').classList.contains('hidden')){$('login-title').innerHTML=`${tr('welcome')},<br><span>${esc(selected.name)}!</span>`;$('login-subtitle').textContent=tr('enterPin')}else{$('login-title').innerHTML=`${tr('goodMorning')},<br><span>${tr('driver')}</span>`;$('login-subtitle').textContent=tr('tapName')}renderDrivers();if(active){renderShift();renderRides()}tick()}
    function toggleLanguage(){language=language==='en'?'es':'en';localStorage.setItem('ablecareDriverLanguage',language);applyLanguage()}
    function tick(){const n=new Date(),locale=language==='es'?'es-US':'en-US';$('clock-time').textContent=n.toLocaleTimeString(locale,{hour:'numeric',minute:'2-digit'});$('clock-date').textContent=n.toLocaleDateString(locale,{weekday:'long',month:'long',day:'numeric'})}
    ['1','2','3','4','5','6','7','8','9','del','0','ok'].forEach(key=>{const b=document.createElement('button');b.className=`key${key==='ok'?' ok':''}`;b.textContent=key==='del'?'⌫':key==='ok'?'✓':key;b.onclick=()=>pinKey(key);$('keypad').appendChild(b)});$('pin-back').onclick=backToDrivers;$('clock-btn').onclick=toggleClock;$('login-lang').onclick=toggleLanguage;$('app-lang').onclick=toggleLanguage;
    $('refresh-btn').onclick=async()=>{await loadData();renderRides()};$('logout-btn').onclick=()=>{localStorage.removeItem('ablecareDriver');location.reload()};
    window.addEventListener('online',()=>$('offline').classList.add('hidden'));window.addEventListener('offline',()=>$('offline').classList.remove('hidden'));if(!navigator.onLine)$('offline').classList.remove('hidden');
    if('serviceWorker'in navigator)navigator.serviceWorker.register('/driver-sw.js').catch(()=>{});setInterval(tick,1000);applyLanguage();boot();
  </script>
