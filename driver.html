<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1f33">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AbleCare Driver">
  <title>AbleCare Driver</title>
  <link rel="manifest" href="/driver-manifest.json">
  <link rel="icon" href="/driver-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/driver-icon.svg">
  <style>
    :root{--navy:#0b1f33;--navy2:#173653;--cyan:#16b8d4;--paper:#f3f7fa;--ink:#10263c;--muted:#64788c;--line:#dce7ef;--green:#16835b;--red:#c34242;--amber:#d78b13}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    button,input{font:inherit}.shell{max-width:620px;margin:0 auto;min-height:100vh;background:#fff;box-shadow:0 0 35px rgba(11,31,51,.08)}
    .hero{background:linear-gradient(145deg,var(--navy),var(--navy2));color:#fff;padding:calc(24px + env(safe-area-inset-top)) 22px 24px;border-radius:0 0 28px 28px}
    .brand{display:flex;align-items:center;gap:12px}.mark{width:48px;height:48px;border-radius:15px;background:var(--cyan);display:grid;place-items:center;font-weight:950;font-size:22px}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0 0;color:#b9d0e1;font-size:12px;font-weight:650}
    .hero-row{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-top:24px}.hello{font-size:13px;color:#b9d0e1}.driver-name{font-size:27px;font-weight:900;margin-top:2px}.shift-pill{border:1px solid rgba(255,255,255,.22);padding:8px 12px;border-radius:999px;font-size:12px;font-weight:850;white-space:nowrap}.shift-pill.in{background:#16835b;border-color:#16835b}
    main{padding:20px 18px calc(28px + env(safe-area-inset-bottom))}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 6px 22px rgba(11,31,51,.055);margin-bottom:15px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.section-title h2{font-size:16px;margin:0}.count{font-size:11px;font-weight:900;color:#087d96;background:#e2f8fc;padding:5px 9px;border-radius:999px}
    .clock-card{text-align:center}.clock-time{font-size:36px;font-weight:900;letter-spacing:-1px}.clock-date{font-size:13px;color:var(--muted);margin:4px 0 16px}.primary{width:100%;border:0;border-radius:14px;padding:16px;color:#fff;background:var(--cyan);font-weight:900;font-size:15px;box-shadow:0 8px 18px rgba(22,184,212,.25)}.primary.out{background:#fff;color:var(--red);border:2px solid #f2caca;box-shadow:none}.primary:disabled{opacity:.55;box-shadow:none}.shift-note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.45}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#eaf1f6;border-radius:13px;padding:4px;margin-bottom:14px}.tab{border:0;border-radius:10px;background:transparent;color:var(--muted);padding:10px;font-weight:850;font-size:13px}.tab.active{background:#fff;color:var(--navy);box-shadow:0 2px 9px rgba(11,31,51,.1)}
    .ride{border:1px solid var(--line);border-left:4px solid var(--cyan);border-radius:14px;padding:14px;margin-top:10px}.ride-top{display:flex;align-items:center;gap:8px}.time{font-size:14px;font-weight:950}.type{font-size:10px;font-weight:900;background:#e7f8fb;color:#087d96;border-radius:999px;padding:4px 7px}.client{font-weight:900;font-size:16px;margin:9px 0 7px}.route{font-size:12px;line-height:1.5;color:#465e73}.route div+div{margin-top:4px}.notes{font-size:12px;background:#fff8e8;color:#7c570f;border-radius:9px;padding:8px;margin-top:9px}.nav-link{display:inline-flex;margin-top:9px;color:#087d96;font-size:12px;font-weight:850;text-decoration:none}
    .empty{text-align:center;padding:24px 10px;color:var(--muted);font-size:13px;line-height:1.5}.released{font-size:11px;color:var(--green);font-weight:850}.unreleased{color:var(--amber)}
    .login{padding:0;background:var(--paper)}.login-head{background:var(--navy);color:#fff;padding:calc(28px + env(safe-area-inset-top)) 22px 36px;border-radius:0 0 26px 26px}.login-head .brand{color:#fff}.login-head h2{font-size:28px;line-height:1.2;margin:30px 0 7px}.login-head h2 span{color:var(--cyan)}.login-head p{font-size:13px;color:#9db2c5;margin:0}.login-body{padding:22px}.login-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:800;margin:0 0 14px}.driver-grid{display:grid;grid-template-columns:1fr;gap:10px}.driver-btn{display:flex;align-items:center;gap:14px;border:0;background:#fff;border-radius:18px;padding:15px;text-align:left;box-shadow:0 3px 12px rgba(11,31,51,.07);font-weight:850;color:var(--ink)}.driver-avatar{width:46px;height:46px;border-radius:13px;color:#fff;display:grid;place-items:center;font-size:20px;font-weight:950}.driver-info{flex:1}.driver-role{display:block;font-size:11px;color:var(--muted);margin-top:3px;font-weight:600}.driver-arrow{width:34px;height:34px;border-radius:9px;background:#e7f8fb;color:#087d96;display:grid;place-items:center;font-size:22px}.pin-screen{text-align:center}.pin-dots{display:flex;justify-content:center;gap:16px;margin:28px 0 18px}.pin-dot{width:16px;height:16px;border-radius:50%;background:var(--navy2);border:2px solid var(--muted)}.pin-dot.on{background:var(--cyan);border-color:var(--cyan)}.keypad{width:260px;max-width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 auto 16px}.key{height:60px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:var(--navy2);color:#fff;font-size:22px;font-weight:800}.key.ok{background:var(--cyan);color:var(--navy)}.back-btn{border:0;background:none;color:var(--muted);padding:12px;font-size:14px}.error{min-height:20px;text-align:center;color:var(--red);font-size:12px;margin-top:6px}.utility{display:flex;justify-content:center;gap:15px;margin-top:18px}.text-btn{border:0;background:none;color:var(--muted);font-size:12px;font-weight:800;padding:5px}.hidden{display:none!important}.loading{display:grid;place-items:center;min-height:100vh;color:var(--muted);font-weight:800}.offline{position:fixed;z-index:5;top:0;left:50%;transform:translateX(-50%);background:#fff1c7;color:#795600;padding:7px 14px;border-radius:0 0 10px 10px;font-size:11px;font-weight:900}
    @media(max-width:380px){.hero{padding-left:17px;padding-right:17px}.driver-name{font-size:23px}main{padding-left:13px;padding-right:13px}.clock-time{font-size:32px}}
  </style>
</head>
<body>
  <div id="offline" class="offline hidden">Offline — reconnect to update your shift</div>
  <div id="loading" class="loading">Loading AbleCare Driver…</div>
  <div id="login" class="shell login hidden">
    <div class="login-head"><div class="brand"><div class="mark">A</div><div><h1>AbleCare Mobility</h1><p>DRIVER APP</p></div></div><h2 id="login-title">Good morning,<br><span>Driver!</span></h2><p id="login-subtitle">Tap your name to see your schedule</p></div>
    <div class="login-body">
      <div id="select-screen"><div class="login-label">Select Your Name</div><div id="driver-grid" class="driver-grid"></div></div>
      <div id="pin-screen" class="pin-screen hidden"><div class="pin-dots"><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span></div><div id="login-error" class="error"></div><div id="keypad" class="keypad"></div><button id="pin-back" class="back-btn">← Back</button></div>
      <input id="pin" class="hidden" inputmode="numeric" maxlength="4" aria-label="Four digit driver PIN">
    </div>
  </div>
  <div id="app" class="shell hidden">
    <header class="hero"><div class="brand"><div class="mark">A</div><div><h1>AbleCare Mobility</h1><p>Driver Portal</p></div></div><div class="hero-row"><div><div class="hello">Welcome back</div><div id="driver-name" class="driver-name"></div></div><div id="shift-pill" class="shift-pill">OFF SHIFT</div></div></header>
    <main>
      <section class="card"><div class="section-title"><h2>Your schedule</h2></div><div class="section-title"><h2 style="font-size:12px;letter-spacing:1px">TODAY</h2><span id="today-count" class="count"></span></div><div id="today-rides"></div><div class="section-title" style="margin-top:20px"><h2 style="font-size:12px;letter-spacing:1px">TOMORROW</h2><span id="release-state" class="released"></span></div><div id="tomorrow-rides"></div></section>
      <section class="card clock-card"><div id="clock-time" class="clock-time"></div><div id="clock-date" class="clock-date"></div><button id="clock-btn" class="primary">CLOCK IN — START SHIFT</button></section>
      <div class="utility"><button id="refresh-btn" class="text-btn">Refresh schedule</button><button id="logout-btn" class="text-btn">← Not you? Go back</button></div>
    </main>
  </div>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script>
    const cfg={apiKey:'AIzaSyBhVuubrvIg5iq_CWByHCn-LF6txhZG0Ig',authDomain:'ablecare-fleet.firebaseapp.com',databaseURL:'https://ablecare-fleet-default-rtdb.firebaseio.com',projectId:'ablecare-fleet',storageBucket:'ablecare-fleet.firebasestorage.app',messagingSenderId:'429072390729',appId:'1:429072390729:web:fb3bbb1561c376cf9ebd98'};
    firebase.initializeApp(cfg); const db=firebase.database();
    const $=id=>document.getElementById(id), safe=s=>String(s||'').replace(/[.#$\[\]\/]/g,'_');
    let drivers=[], selected=null, active=null, shift=null, allRides={}, schedules={}, view='today';
    const dateKey=(offset=0)=>{const d=new Date();d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
    const parseTime=t=>{if(!t)return 9999;const m=String(t).match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);if(!m)return 9999;let h=+m[1];if(m[3]){if(m[3].toUpperCase()==='PM'&&h<12)h+=12;if(m[3].toUpperCase()==='AM'&&h===12)h=0}return h*60+(+m[2])};
    const fmtTime=t=>{if(!t)return 'Time TBD';const mins=parseTime(t);if(mins===9999)return t;const h=Math.floor(mins/60),m=mins%60;return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`};
    const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function show(which){$('loading').classList.add('hidden');$('login').classList.toggle('hidden',which!=='login');$('app').classList.toggle('hidden',which!=='app')}
    async function boot(){
      try{const snap=await db.ref('drivers').once('value');drivers=Object.values(snap.val()||{}).filter(d=>d&&d.active&&d.name);renderDrivers();const saved=localStorage.getItem('ablecareDriver');if(saved){const d=drivers.find(x=>x.name===saved);if(d){active=d;await enterApp();return}}show('login')}catch(e){$('loading').textContent='Unable to connect. Check your internet and refresh.'}}
    const driverColors=['#16b8d4','#7c5ce7','#f0a21b','#16835b','#e45c78'];
    function renderDrivers(){const grid=$('driver-grid');grid.innerHTML='';drivers.forEach((d,i)=>{const b=document.createElement('button');b.className='driver-btn';b.innerHTML=`<span class="driver-avatar" style="background:${driverColors[i%driverColors.length]}">${esc(d.name[0])}</span><span class="driver-info">${esc(d.name)}<span class="driver-role">Van Driver · AbleCare Mobility</span></span><span class="driver-arrow">›</span>`;b.onclick=()=>selectDriver(d);grid.appendChild(b)})}
    function selectDriver(d){selected=d;$('pin').value='';$('login-error').textContent='';updatePinDots();$('select-screen').classList.add('hidden');$('pin-screen').classList.remove('hidden');$('login-title').innerHTML=`Welcome,<br><span>${esc(d.name)}!</span>`;$('login-subtitle').textContent='Enter your PIN to see your schedule'}
    function backToDrivers(){selected=null;$('pin').value='';$('login-error').textContent='';$('pin-screen').classList.add('hidden');$('select-screen').classList.remove('hidden');$('login-title').innerHTML='Good morning,<br><span>Driver!</span>';$('login-subtitle').textContent='Tap your name to see your schedule'}
    function updatePinDots(){document.querySelectorAll('.pin-dot').forEach((dot,i)=>dot.classList.toggle('on',i<$('pin').value.length))}
    function pinKey(key){let value=$('pin').value;if(key==='del')value=value.slice(0,-1);else if(key==='ok'){login();return}else if(value.length<4)value+=key;$('pin').value=value;updatePinDots();$('login-error').textContent='';if(value.length===4)login()}
    async function login(){const pin=$('pin').value;if(!selected){$('login-error').textContent='Choose your name first.';return}if(String(selected.pin)!==pin){$('login-error').textContent='That PIN is not correct.';$('pin').value='';updatePinDots();return}active=selected;localStorage.setItem('ablecareDriver',active.name);await enterApp()}
    async function enterApp(){$('driver-name').textContent=active.name;show('app');await Promise.all([loadShift(),loadData()]);renderShift();renderRides()}
    async function loadShift(){const savedKey=localStorage.getItem('ablecareShiftKey');if(savedKey){const snap=await db.ref(`shifts/${safe(active.name)}/${savedKey}`).once('value');const val=snap.val();if(val&&!val.clockOut){shift={key:savedKey,...val};return}}const snap=await db.ref(`shifts/${safe(active.name)}`).once('value');const entries=Object.entries(snap.val()||{}).filter(([,v])=>v&&!v.clockOut).sort((a,b)=>(b[1].clockIn||0)-(a[1].clockIn||0));shift=entries.length?{key:entries[0][0],...entries[0][1]}:null;if(shift)localStorage.setItem('ablecareShiftKey',shift.key);else localStorage.removeItem('ablecareShiftKey')}
    async function loadData(){const [r,s]=await Promise.all([db.ref('rides').once('value'),db.ref('schedules').once('value')]);allRides=r.val()||{};schedules=s.val()||{}}
    async function toggleClock(){if(!navigator.onLine){alert('You need an internet connection to clock in or out.');return}$('clock-btn').disabled=true;try{const now=Date.now(),driverKey=safe(active.name);if(!shift){const newRef=db.ref(`shifts/${driverKey}`).push();shift={key:newRef.key,clockIn:now,clockOut:null,driver:active.name,source:'driver-web'};await Promise.all([newRef.set(shift),db.ref(`locations/${driverKey}`).update({driver:active.name,clockIn:now,clockOut:null,ts:now,tracking:false,source:'driver-web'})]);localStorage.setItem('ablecareShiftKey',shift.key)}else{const durationMs=Math.max(0,now-shift.clockIn);await Promise.all([db.ref(`shifts/${driverKey}/${shift.key}`).update({clockOut:now,durationMs,source:'driver-web'}),db.ref(`locations/${driverKey}`).update({clockOut:now,ts:now,tracking:false,source:'driver-web'})]);shift=null;localStorage.removeItem('ablecareShiftKey')}renderShift()}catch(e){alert('Could not update your shift. Please try again.')}finally{$('clock-btn').disabled=false}}
    function renderShift(){const on=!!shift;$('shift-pill').textContent=on?'ON DUTY':'OFF SHIFT';$('shift-pill').classList.toggle('in',on);$('clock-btn').textContent=on?'CLOCK OUT — END SHIFT':'CLOCK IN — START SHIFT';$('clock-btn').classList.toggle('out',on)}
    function driverSafeNotes(value){const note=String(value||'').trim();if(!note)return '';if(/(?:^|\s)\$?\d[\d,.]*\s*(?:total|tip)\b|\b(?:total|tip)\s*[:$]/i.test(note))return '';return note}
    function rideAddress(r,kind){const fields=kind==='pickup'?['pickup','pickupAddress','pickup_location','pickupLocation','pickupAddr','from','origin','facilityPickup','facility']:['dropoff','dropoffAddress','dropoff_location','dropoffLocation','dropoffAddr','to','destination','appointmentAddress'];return fields.map(k=>r[k]).find(Boolean)||''}
    function renderRideList(list,box,emptyText){if(!list.length){box.innerHTML=`<div class="empty">${emptyText}</div>`;return}box.innerHTML=list.map(r=>{const p=rideAddress(r,'pickup'),d=rideAddress(r,'dropoff'),nav=d||p,note=driverSafeNotes(r.notes);return `<article class="ride"><div class="ride-top"><span class="type">${esc(r.ridetype==='str'?'Stretcher':r.ridetype==='wc'?'Wheelchair':'Ambulatory')}</span><span class="time" style="margin-left:auto">${esc(fmtTime(r.time))}</span></div><div class="client">${esc(r.client||'Client TBD')}</div><div class="route"><div>Pickup: ${esc(p||'Not provided')}</div><div>Drop-off: ${esc(d||'Not provided')}</div></div>${note?`<div class="notes">${esc(note)}</div>`:''}${nav?`<a class="nav-link" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(nav)}">Open in Maps →</a>`:''}</article>`}).join('')}
    function renderRides(){const rides=Object.entries(allRides).map(([key,r])=>({key,...r})).filter(r=>String(r.driver||'').trim().toLowerCase()===active.name.trim().toLowerCase());const today=rides.filter(r=>r.date===dateKey(0)).sort((a,b)=>parseTime(a.time)-parseTime(b.time));const tomorrow=rides.filter(r=>r.date===dateKey(1)).sort((a,b)=>parseTime(a.time)-parseTime(b.time));const released=!!schedules[dateKey(1)]?.sentAt;$('today-count').textContent=`${today.length} ride${today.length===1?'':'s'}`;$('release-state').textContent=released?`${tomorrow.length} ride${tomorrow.length===1?'':'s'}`:'Not released yet';$('release-state').classList.toggle('unreleased',!released);renderRideList(today,$('today-rides'),'No rides assigned for today');if(released)renderRideList(tomorrow,$('tomorrow-rides'),'No rides scheduled for tomorrow yet');else $('tomorrow-rides').innerHTML='<div class="empty">Tomorrow’s schedule has not been sent yet.</div>'}
    function tick(){const n=new Date();$('clock-time').textContent=n.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});$('clock-date').textContent=n.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}
    ['1','2','3','4','5','6','7','8','9','del','0','ok'].forEach(key=>{const b=document.createElement('button');b.className=`key${key==='ok'?' ok':''}`;b.textContent=key==='del'?'⌫':key==='ok'?'✓':key;b.onclick=()=>pinKey(key);$('keypad').appendChild(b)});$('pin-back').onclick=backToDrivers;$('clock-btn').onclick=toggleClock;
    $('refresh-btn').onclick=async()=>{await loadData();renderRides()};$('logout-btn').onclick=()=>{localStorage.removeItem('ablecareDriver');location.reload()};
    window.addEventListener('online',()=>$('offline').classList.add('hidden'));window.addEventListener('offline',()=>$('offline').classList.remove('hidden'));if(!navigator.onLine)$('offline').classList.remove('hidden');
    if('serviceWorker'in navigator)navigator.serviceWorker.register('/driver-sw.js').catch(()=>{});setInterval(tick,1000);tick();boot();
  </script>
</body>
</html>
